  parts:
    abstract: >
      Projekt měří, jak často citace AI asistentů s webovým vyhledáváním
      (ChatGPT, Gemini, Claude, Perplexity, Grok) skutečně podporují tvrzení,
      ke kterým jsou připojeny. Porovnáváme produkty jako celky na 40 faktických
      rešeršních dotazech v češtině a angličtině a ve třech promptových
      podmínkách. Hlavní metrikou je citační přesnost na úrovni tvrzení,
      doplněná úplností citací a správností odpovědi.

    acknowledgements: >
      Mendelova univerzita v Brně, Provozně ekonomická fakulta.
      Všichni autoři přispěli k vypracování zadání.

    availability: >
      Protokol, data, prompty, skripty a testy jsou dostupné na
      https://github.com/Nouzl0/ENC-AI-Project.

