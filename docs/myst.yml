  parts:
    abstract: >
      Studie hodnotí podporu tvrzení citovanými zdroji u AI produktů s webovým
      vyhledáváním. Sběr obsahuje 40 různých úloh a 93 uložených věcných
      odpovědí, z nich 92 podkladů pro nezávislé lidské hodnocení.
      Gemini má 9 nových otázek v P1/P2/P3A. Opravené AI posouzení
      pilotu uvádí 47 ze 48 RF správně; vybraný citační subset má precision
      0,7954 (11 dokončených odpovědí, 99 explicitních párů). Lidské listy
      jsou zaslepené a ratingy prázdné. Úplná produktová matice, skutečné
      lidské ratingy a původní G1/G2/G3 nejsou dokončené.

    acknowledgements: >
      Mendelova univerzita v Brně, Provozně ekonomická fakulta.
      Týmový projekt ENC-AI.

    availability: >
      Protokol, data, prompty, skripty a testy jsou dostupné na
      https://github.com/Nouzl0/ENC-AI-Assignment-2.

