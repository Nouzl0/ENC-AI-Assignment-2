  parts:
    abstract: >
      Studie hodnotí podporu tvrzení citovanými zdroji u AI produktů s webovým
      vyhledáváním. Balíček obsahuje 40 různých měřených úloh a 84 věcných
      odpovědí, z toho 33 původních pilotních a 51 doplňkových. Deset nových
      otázek vzniklo odděleně po byte/hash zmrazení promptů. Pět z nich má
      Gemini P1/P2/P3A. AI obsahový audit pilotu našel 47 ze 48 povinných faktů
      správně; atomizovaný subset 11 odpovědí má průměrné meze citační precision
      0,7141 až 0,8050. Výsledky jsou pomocné AI hodnocení, nikoli lidské ratingy,
      dokončená vyvážená matice nebo splnění původních bran G1/G2/G3.

    acknowledgements: >
      Mendelova univerzita v Brně, Provozně ekonomická fakulta.
      Všichni autoři přispěli k vypracování zadání.

    availability: >
      Protokol, data, prompty, skripty a testy jsou dostupné na
      https://github.com/Nouzl0/ENC-AI-Project.

