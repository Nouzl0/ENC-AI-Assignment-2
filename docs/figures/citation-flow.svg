<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 760 190' width='760' height='190' role='img' aria-label='Hodnocení citací'><rect width='760' height='190' fill='#ffffff'/><text x='20' y='28' font-family='Helvetica, Arial, sans-serif' font-size='14' fill='#1f2937' text-anchor='start' font-weight='bold'>Jak se hodnotí citace</text><rect x='20' y='55' width='150' height='70' rx='8' fill='#eff6ff' stroke='#1d4ed8'/><text x='95.0' y='86.0' font-family='Helvetica, Arial, sans-serif' font-size='14' fill='#1f2937' text-anchor='middle' font-weight='bold'>Odpověď</text><text x='95.0' y='104.0' font-family='Helvetica, Arial, sans-serif' font-size='10.5' fill='#6b7280' text-anchor='middle' font-weight='normal'>text + URL beze změn</text><rect x='190' y='55' width='150' height='70' rx='8' fill='#eff6ff' stroke='#1d4ed8'/><text x='265.0' y='86.0' font-family='Helvetica, Arial, sans-serif' font-size='14' fill='#1f2937' text-anchor='middle' font-weight='bold'>Tvrzení ↔ zdroj</text><text x='265.0' y='104.0' font-family='Helvetica, Arial, sans-serif' font-size='10.5' fill='#6b7280' text-anchor='middle' font-weight='normal'>jen explicitní dvojice</text><rect x='360' y='55' width='150' height='70' rx='8' fill='#eff6ff' stroke='#1d4ed8'/><text x='435.0' y='86.0' font-family='Helvetica, Arial, sans-serif' font-size='14' fill='#1f2937' text-anchor='middle' font-weight='bold'>Dva lidé</text><text x='435.0' y='104.0' font-family='Helvetica, Arial, sans-serif' font-size='10.5' fill='#6b7280' text-anchor='middle' font-weight='normal'>S2 / S1 / S0 / NA / FAB</text><rect x='530' y='55' width='150' height='70' rx='8' fill='#eff6ff' stroke='#1d4ed8'/><text x='605.0' y='86.0' font-family='Helvetica, Arial, sans-serif' font-size='14' fill='#1f2937' text-anchor='middle' font-weight='bold'>Přesnost</text><text x='605.0' y='104.0' font-family='Helvetica, Arial, sans-serif' font-size='10.5' fill='#6b7280' text-anchor='middle' font-weight='normal'>S2 ÷ všechny dvojice</text><line x1='170' y1='90' x2='184' y2='90' stroke='#6b7280' stroke-width='2'/><polygon points='190,90 182,85 182,95' fill='#6b7280'/><line x1='340' y1='90' x2='354' y2='90' stroke='#6b7280' stroke-width='2'/><polygon points='360,90 352,85 352,95' fill='#6b7280'/><line x1='510' y1='90' x2='524' y2='90' stroke='#6b7280' stroke-width='2'/><polygon points='530,90 522,85 522,95' fill='#6b7280'/><text x='20' y='160' font-family='Helvetica, Arial, sans-serif' font-size='12' fill='#6b7280' text-anchor='start' font-weight='normal'>NA a FAB zůstávají ve jmenovateli; S2 znamená podporu zdrojem, ne pravdivost odpovědi.</text></svg>
