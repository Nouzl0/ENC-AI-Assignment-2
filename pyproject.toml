[project]
name = "enc-ai-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "mystmd>=1.11.0",
    "pytest>=9.1.1",
]

[dependency-groups]
dev = [
    "ruff==0.16.1",
]

[tool.ruff]
required-version = "==0.16.1"
# The uv documentation/tooling environment uses 3.14; standalone scripts support 3.9+.
target-version = "py39"
line-length = 88
src = ["scripts", "tests"]

[tool.ruff.lint]
# Formatting is handled by `ruff format`, including wrapping where safe.
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "C4", "SIM", "PIE", "RUF"]
# These are intentional typography and distinct semantic symbols in parser fixtures.
allowed-confusables = ["–", "−", "×"]
